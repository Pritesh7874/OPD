server.port=8080
spring.application.name=opd-backend

# ---- MySQL (override with environment variables) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:opd_management}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
# "update" creates missing tables and keeps existing data across restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- App settings ----
# Comma-separated list of browser origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Set APP_DEMO_DATA_ENABLED=true to insert a few sample patients on first start.
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}
